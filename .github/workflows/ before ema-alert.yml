# Save this file in your repo as: .github/workflows/ema-alert.yml
name: EMA 21/50 crossover alert

on:
  schedule:
    # UTC times. 04:02-09:47 UTC = 09:32-15:17 IST, plus 10:02 UTC = 15:32 IST.
    # Runs Mon-Fri, a couple of minutes after each 15-min candle closes.
    - cron: "2,17,32,47 4-9 * * 1-5"
    - cron: "2 10 * * 1-5"
  workflow_dispatch: {}   # lets you run it manually to test

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python ema_scan.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
